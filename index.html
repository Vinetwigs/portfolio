<html lang="en">
<head>

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://vinetwigs.github.io/portfolio/">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://vinetwigs.github.io/portfolio/">
    <meta name="twitter:title" content="vino | new media artist">
    <meta name="twitter:description" content="Portfolio of a new media artist exploring the boundaries between physical and digital realms.">
    <meta name="twitter:image" content="https://vinetwigs.github.io/portfolio/assets/og-image.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⧉</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⧉</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>
    
    <header id="menu-bar">
        <div class="menu-left">
            <span class="menu-logo">⧉</span>
            <span class="menu-title">vino | portfolio</span>
        </div>
        <nav class="menu-nav" role="navigation" aria-label="Main navigation">
            <button class="menu-btn active" data-section="home" aria-current="page">home</button>
            <button class="menu-btn" data-section="about">about</button>
            <button class="menu-btn" data-section="works">works</button>
            <button class="menu-btn" data-section="contact">contact</button>
        </nav>
        <div class="menu-right">
            <span class="menu-time" id="system-time" aria-live="polite">00:00</span>
        </div>
    </header>

    <main id="desktop" role="main">
        <div id="windows-container"></div>
        
        <div id="welcome-overlay" class="hidden" aria-hidden="true">
            <div class="welcome-content">
                <h1 class="welcome-title">welcome</h1>
                <p class="welcome-text">click anywhere to enter</p>
            </div>
        </div>
    </main>

    <footer id="status-bar" role="contentinfo">
        <div class="status-left">
            <span class="status-item" id="status-section" aria-live="polite">READY</span>
        </div>
        <div class="status-center">
            <span class="status-item status-artist">⧉</span>
        </div>
        <div class="status-right">
            <span class="status-item" id="status-windows">windows: 0</span>
            <span class="status-divider">|</span>
            <span class="status-item" id="version">v1.0 [2026]</span>
        </div>
    </footer>

    <div id="custom-cursor" aria-hidden="true"></div>

    <template id="window-template">
        <div class="window" data-window-id="" role="dialog" aria-labelledby="window-title">
            <div class="window-header">
                <div class="window-controls">
                    <button class="window-btn close" aria-label="Close window">×</button>
                    <button class="window-btn maximize" aria-label="Maximize window">□</button>
                </div>
                <div class="window-title"></div>
                <div class="window-spacer"></div>
            </div>
            <div class="window-content"></div>
            <div class="window-resize-handle" aria-hidden="true"></div>
        </div>
    </template>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "vino",
        "url": "https://vinetwigs.github.io/portfolio/",
        "jobTitle": "New Media Artist",
        "description": "New media artist exploring the boundaries between physical and digital realms",
        "address": {
            "@type": "PostalAddress",
            "addressLocality": "Turin",
            "addressCountry": "Italy"
        },
        "sameAs": [
            "https://www.instagram.com/vino.exe",
            "https://github.com/Vinetwigs"
        ],
        "knowsAbout": ["Generative Art", "Installation", "VR", "AR", "Projection Mapping", "Sound Design"]
    }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="three-scene.js"></script>
    <script src="js/window-manager.js"></script>
    <script src="js/sections.js"></script>
    <script src="main.js"></script>
</body>
</html>
